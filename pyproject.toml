[project]
name = "ai-marketer"
version = "0.1.0"
description = "Автономный AI-маркетолог: агент + Telegram-бот + автопубликации"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = [
    "RUF001", # кириллица в строках — это нормально
    "RUF002",
    "RUF003",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:dateparser.*"]
