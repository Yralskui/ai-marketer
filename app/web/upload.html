<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Загрузка документа</title>
<link rel="stylesheet" href="/upload.css">
<main>
<h1>Загрузить документ</h1>
<p>PDF и изображения. До 100 МБ с учётом уже загруженных файлов профиля.</p>
<form>
  <label for="file">Документ</label>
  <input id="file" type="file" accept="image/*,.pdf,.heic,.heif,.avif,.svg" required>
  <button>Загрузить</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
</main>
<script src="/upload.js" defer></script>
</html>
